  <circle cx="118.79269230769228" cy="652.7397127345938" r="4" fill="#794c9b" />
  <text x="100.79269230769228" y="768" class="small muted">404.7</text>
  <circle cx="210.0592307692308" cy="670.7705005878063" r="4" fill="#526caa" />
  <text x="192.0592307692308" y="768" class="small muted">435.8</text>
  <circle cx="357.6703846153847" cy="692.4899654655737" r="4" fill="#238994" />
  <text x="339.6703846153847" y="768" class="small muted">486.1</text>
  <circle cx="533.7473076923077" cy="710.7669833936562" r="4" fill="#497d44" />
  <text x="515.7473076923077" y="768" class="small muted">546.1</text>
  <circle cx="655.5338461538462" cy="720.3135557122503" r="4" fill="#af791c" />
  <text x="637.5338461538462" y="768" class="small muted">587.6</text>
  <circle cx="857.1419230769229" cy="732.5595387331186" r="4" fill="#b64c3e" />
  <text x="839.1419230769229" y="768" class="small muted">656.3</text>
  <text x="934" y="639" class="small muted">degrees / nanometers</text>
  <text x="934" y="682" class="small">Sellmeier dispersion</text>
  <text x="934" y="703" class="small">Vector Snell refraction</text>
  <text x="934" y="724" class="small">Exact dielectric Fresnel</text>
  <line x1="48" y1="792" x2="1232" y2="792" stroke="#d5d7ce" stroke-width="1" />
  <text x="48" y="818" class="small muted">Source: SCHOTT N-BK7 datasheet, 01-Dec-2023. No coatings, bulk absorption or secondary reflections.</text>
</svg>