  <text x="934" y="320">486.1</text>
  <text x="1020" y="320">1.52238</text>
  <text x="1130" y="320">39.491</text>
  <line x1="912" y1="350" x2="925" y2="350" stroke="#497d44" stroke-width="3" />
  <text x="934" y="355">546.1</text>
  <text x="1020" y="355">1.51872</text>
  <text x="1130" y="355">39.139</text>
  <line x1="912" y1="385" x2="925" y2="385" stroke="#af791c" stroke-width="3" />
  <text x="934" y="390">587.6</text>
