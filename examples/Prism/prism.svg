<?xml version="1.0" encoding="utf-8"?>
<svg width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Caustikon - N-BK7 prism dispersion</title>
  <desc id="description">Six coincident incident rays refract through a 60 degree N-BK7 prism. The drawing preserves geometry. A separate chart resolves their calculated angular deviations.</desc>
  <rect width="1280" height="840" fill="#faf9f5" />
  <style>text { fill: #252824; font-family: 'Consolas', 'Liberation Mono', monospace; font-size: 13px; } .title { font-family: 'Georgia', 'Liberation Serif', serif; font-size: 42px; } .muted { fill: #666b62; } .small { font-size: 11px; }</style>
  <text x="48" y="42" class="small">CAUSTIKON  /  GEOMETRIC OPTICS</text>
  <text x="48" y="98" class="title">One prism. Six wavelengths.</text>
  <text x="48" y="130" class="muted">N-BK7  |  60 deg apex  |  45 deg incidence  |  air / glass / air</text>
  <text x="1116" y="42" class="small">PLATE 01</text>
  <line x1="48" y1="152" x2="1232" y2="152" stroke="#d5d7ce" stroke-width="1" />
  <polygon points="255.000,526.000 585.000,526.000 420.000,240.212" fill="#eceee5" stroke="#464b41" stroke-width="1.5" />
  <text x="402" y="277" class="small">60 deg</text>
  <text x="395" y="340">N-BK7</text>
  <text x="355" y="363" class="small muted">homogeneous glass</text>
  <text x="69" y="423" class="small muted">coincident input</text>
  <text x="69" y="443" class="small muted">+15 deg</text>
  <line x1="73.5" y1="486.3999938964844" x2="315.26409912109375" y2="421.6195068359375" stroke="#252824" stroke-width="1.6" />
  <polyline points="315.264,421.620 530.104,430.917 783.000,550.217" fill="none" stroke="#794c9b" stroke-width="1.25" />
  <polyline points="315.264,421.620 529.949,430.650 783.000,548.156" fill="none" stroke="#526caa" stroke-width="1.25" />
  <polyline points="315.264,421.620 529.761,430.324 783.000,545.681" fill="none" stroke="#238994" stroke-width="1.25" />
  <polyline points="315.264,421.620 529.601,430.046 783.000,543.604" fill="none" stroke="#497d44" stroke-width="1.25" />
  <polyline points="315.264,421.620 529.516,429.899 783.000,542.522" fill="none" stroke="#af791c" stroke-width="1.25" />
  <polyline points="315.264,421.620 529.407,429.710 783.000,541.135" fill="none" stroke="#b64c3e" stroke-width="1.25" />
  <text x="60" y="560" class="small muted">Ray geometry is to scale. The narrow fan is physical; colors identify wavelengths.</text>
  <text x="934" y="192" class="small">CALCULATED OUTPUT</text>
  <text x="934" y="218" class="small muted">nm</text>
  <text x="1020" y="218" class="small muted">n</text>
  <text x="1130" y="218" class="small muted">delta</text>
  <line x1="912" y1="245" x2="925" y2="245" stroke="#794c9b" stroke-width="3" />
  <text x="934" y="250">404.7</text>
  <text x="1020" y="250">1.53023</text>
  <text x="1130" y="250">40.255</text>
  <line x1="912" y1="280" x2="925" y2="280" stroke="#526caa" stroke-width="3" />
  <text x="934" y="285">435.8</text>
  <text x="1020" y="285">1.52669</text>
  <text x="1130" y="285">39.908</text>
