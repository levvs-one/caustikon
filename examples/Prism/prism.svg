  <text x="934" y="425">656.3</text>
  <text x="1020" y="425">1.51432</text>
  <text x="1130" y="425">38.720</text>
  <text x="934" y="493" class="small muted">delta = angular deviation</text>
  <text x="934" y="514" class="small muted">from the incident ray, deg</text>
  <line x1="48" y1="582" x2="1232" y2="582" stroke="#d5d7ce" stroke-width="1" />
