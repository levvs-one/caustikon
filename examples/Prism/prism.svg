<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Caustikon - N-BK7 prism dispersion</title>
  <desc id="description">Six coincident rays at 404.7, 435.8, 486.1, 546.1, 587.6, 656.3 nanometers enter a 60 degree N-BK7 prism at 45 degrees to the surface normal. Angles are to scale; the spectral spread is not exaggerated. 404.7 nm bends by 40.255 degrees; 656.3 nm bends by 38.720 degrees. Colors identify wavelengths, not perceived color or transmitted power.</desc>
  <rect width="1200" height="580" fill="#ffffff" />
  <style>text { fill: #282b30; font-family: Arial, Helvetica, sans-serif; font-size: 22px; }</style>
  <polygon points="330.000,470.000 760.000,470.000 545.000,97.609" fill="#f2f3f5" stroke="#494e56" stroke-width="1.5" />
  <text x="545" y="250" text-anchor="middle">N-BK7</text>
  <line x1="93.5" y1="418.4" x2="408.52594" y2="333.98907" stroke="#282b30" stroke-width="2" />
  <polyline points="408.526,333.989 688.468,346.103 1018.000,501.556" fill="none" stroke="#794c9b" stroke-width="1.5" />
  <polyline points="408.526,333.989 688.267,345.755 1018.000,498.870" fill="none" stroke="#526caa" stroke-width="1.5" />
  <polyline points="408.526,333.989 688.022,345.331 1018.000,495.645" fill="none" stroke="#238994" stroke-width="1.5" />
  <polyline points="408.526,333.989 687.813,344.969 1018.000,492.939" fill="none" stroke="#497d44" stroke-width="1.5" />
  <polyline points="408.526,333.989 687.703,344.778 1018.000,491.529" fill="none" stroke="#af791c" stroke-width="1.5" />
  <polyline points="408.526,333.989 687.561,344.532 1018.000,489.722" fill="none" stroke="#b64c3e" stroke-width="1.5" />
  <path d="M 1026.000,489.722 L 1050.000,465.722" fill="none" stroke="#b64c3e" stroke-width="1" />
  <text x="1060" y="472.72202">656.3 nm</text>
  <path d="M 1026.000,501.556 L 1050.000,525.556" fill="none" stroke="#794c9b" stroke-width="1" />
  <text x="1060" y="532.5559">404.7 nm</text>
</svg>