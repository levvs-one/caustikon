name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: pack and push to NuGet.org
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore locked dependencies
        run: dotnet restore Caustikon.sln --locked-mode

      - name: Build
        run: dotnet build Caustikon.sln --configuration Release --no-restore

      - name: Test
        run: |
          for framework in net8.0 net10.0; do
            dotnet test --project tests/Caustikon.Tests/Caustikon.Tests.csproj --configuration Release --framework $framework --no-build --minimum-expected-tests 1
            dotnet test --project tests/Caustikon.Glasses.Tests/Caustikon.Glasses.Tests.csproj --configuration Release --framework $framework --no-build --minimum-expected-tests 1
          done

      - name: Require the tag to match the package version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($project in 'src/Caustikon/Caustikon.csproj', 'src/Caustikon.Glasses/Caustikon.Glasses.csproj') {
            $version = ([xml](Get-Content $project)).Project.PropertyGroup.Version
            if ($version -ne $tag) { throw "$project declares $version but the tag is $tag" }
          }

      - name: Pack
        run: |
          dotnet pack src/Caustikon/Caustikon.csproj --configuration Release --no-build --output artifacts/package
          dotnet pack src/Caustikon.Glasses/Caustikon.Glasses.csproj --configuration Release --no-build --output artifacts/package

      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY is not set; packages were built but not pushed." >&2
            exit 1
          fi
          dotnet nuget push "artifacts/package/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ github.ref_name }}
          path: artifacts/package/*
          if-no-files-found: error
