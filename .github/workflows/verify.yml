name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: production dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require BCL-only production projects
        shell: pwsh
        run: |
          foreach ($project in 'src/Caustikon/Caustikon.csproj', 'src/Caustikon.Glasses/Caustikon.Glasses.csproj') {
            $references = Select-Xml -Path $project -XPath '//PackageReference'
            if ($references) {
              throw "$project must not contain PackageReference items."
            }
          }

      - name: Require every catalogued glass to carry provenance in the data of record
        shell: pwsh
        run: |
          $manifest = Get-Content data/glasses/manifest.json | ConvertFrom-Json
          $count = 0
          foreach ($file in Get-ChildItem data/glasses/*.json | Where-Object Name -ne 'manifest.json') {
            foreach ($glass in Get-Content $file | ConvertFrom-Json) {
              $count++
              foreach ($field in 'source', 'citation', 'path', 'retrievedOn') {
                if ([string]::IsNullOrWhiteSpace($glass.provenance.$field)) {
                  throw "$($glass.vendor)/$($glass.name) lacks provenance.$field"
                }
              }
            }
          }
          if ($count -ne $manifest.glassCount) {
            throw "manifest says $($manifest.glassCount) glasses, data files hold $count"
          }
          Write-Host "$count glasses with complete provenance"

  test:
    name: ${{ matrix.os }} - ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        framework:
          - net8.0
          - net10.0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore locked dependencies
        run: dotnet restore Caustikon.sln --locked-mode

      - name: Build tests
        run: |
          dotnet build tests/Caustikon.Tests/Caustikon.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore
          dotnet build tests/Caustikon.Glasses.Tests/Caustikon.Glasses.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore

      - name: Test core
        run: dotnet test --project tests/Caustikon.Tests/Caustikon.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-build --minimum-expected-tests 1

      - name: Test glasses
        run: dotnet test --project tests/Caustikon.Glasses.Tests/Caustikon.Glasses.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-build --minimum-expected-tests 1

  pack:
    name: pack
    needs:
      - policy
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore Caustikon.sln --locked-mode

      - name: Build solution
        run: dotnet build Caustikon.sln --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Caustikon/Caustikon.csproj --configuration Release --no-build --output artifacts/package
          dotnet pack src/Caustikon.Glasses/Caustikon.Glasses.csproj --configuration Release --no-build --output artifacts/package

      - name: Require XML API documentation in both targets of both packages
        shell: pwsh
        run: |
          foreach ($name in 'Caustikon', 'Caustikon.Glasses') {
            $package = Get-Item "artifacts/package/$name.*.nupkg" | Where-Object Name -notlike '*.symbols.nupkg' | Where-Object { $_.Name -match "^$([regex]::Escape($name))\.\d" }
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              foreach ($framework in 'net8.0', 'net10.0') {
                $entry = $archive.GetEntry("lib/$framework/$name.xml")
                if (-not $entry) { throw "Missing XML documentation for $name $framework." }
                $reader = [System.IO.StreamReader]::new($entry.Open())
                try { [xml]$documentation = $reader.ReadToEnd() } finally { $reader.Dispose() }
                if ($documentation.doc.assembly.name -ne $name -or -not $documentation.doc.members.member) {
                  throw "Invalid or empty XML documentation for $name $framework."
                }
              }
            } finally { $archive.Dispose() }
          }

      - name: Run prism example
        run: dotnet run --project examples/Prism --configuration Release --no-build -- artifacts/package/prism.svg

      - name: Check prism geometry and labels
        shell: pwsh
        run: ./examples/Prism/verify.ps1 -Path artifacts/package/prism.svg

      - name: Check spectral batch across the critical boundary
        run: dotnet run --project examples/CriticalBoundary --configuration Release --no-build

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caustikon-packages
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
            artifacts/package/prism.svg
          if-no-files-found: error
