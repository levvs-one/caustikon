name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: production dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require a BCL-only production project
        shell: pwsh
        run: |
          $references = Select-Xml -Path src/Caustikon/Caustikon.csproj -XPath '//PackageReference'
          if ($references) {
            throw 'src/Caustikon must not contain PackageReference items.'
          }

  test:
    name: ${{ matrix.os }} - ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        framework:
          - net8.0
          - net10.0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore locked dependencies
        run: dotnet restore Caustikon.sln --locked-mode

      - name: Build tests
        run: dotnet build tests/Caustikon.Tests/Caustikon.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore

      - name: Test
        run: dotnet test --project tests/Caustikon.Tests/Caustikon.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-build --minimum-expected-tests 1

  pack:
    name: pack
    needs:
      - policy
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore Caustikon.sln --locked-mode

      - name: Build library and benchmarks
        run: dotnet build Caustikon.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/Caustikon/Caustikon.csproj --configuration Release --no-build --output artifacts/package

      - name: Run prism example
        run: dotnet run --project examples/Prism --configuration Release --no-build -- artifacts/package/prism.svg

      - name: Check prism geometry and labels
        shell: pwsh
        run: ./examples/Prism/verify.ps1 -Path artifacts/package/prism.svg

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caustikon-package
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
            artifacts/package/prism.svg
          if-no-files-found: error
