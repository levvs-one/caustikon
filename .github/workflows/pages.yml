name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Restore locked dependencies
        run: dotnet restore Caustikon.sln --locked-mode

      - name: Publish
        run: dotnet publish site/Caustikon.Site/Caustikon.Site.csproj --configuration Release --no-restore --output artifacts/site

      - name: Rebase for the project path and enable client-side routing
        shell: pwsh
        run: |
          $root = 'artifacts/site/wwwroot'
          $index = Join-Path $root 'index.html'
          (Get-Content $index -Raw) -replace '<base href="/" />', '<base href="/caustikon/" />' | Set-Content $index -NoNewline
          Copy-Item $index (Join-Path $root '404.html')
          New-Item -ItemType File -Path (Join-Path $root '.nojekyll') | Out-Null

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/site/wwwroot

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
